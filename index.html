<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK - Luxury Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00ffcc;
            --secondary-color: #ff0055;
            --glass-bg: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(0, 255, 204, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #020204;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 50px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 204, 0.6); }
            100% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        }

        .logo-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-container span {
            font-size: 0.7rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 35px;
            background: linear-gradient(to bottom, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center; /* توسيط المحتوى في المنتصف */
            gap: 12px; /* مسافة متناسقة بين الأيقونة والنص */
            padding: 18px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.8);
        }

        .social-btn:hover {
            transform: scale(1.05) translateX(-5px) !important;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
        }

        .social-btn i {
            font-size: 1.5rem;
            width: 25px;
            text-align: center;
            margin: 0; /* إزالة المارجن لضمان التوسيط المثالي */
        }

        /* الوان الايكونات */
        .whatsapp i { color: #25D366; }
        .tiktok i { color: #fff; text-shadow: 2px 0px 0px #ff0050, -2px 0px 0px #00f2fe; } /* تأثير التيك توك */
        .instagram i { color: #E1306C; }
        .facebook i { color: #1877F2; }

        /* ======== إعدادات التجاوب (Responsive) للموبايل ======== */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
                border-radius: 30px;
            }
            
            .logo-container {
                width: 80px;
                height: 80px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 25px;
            }

            .social-btn {
                padding: 15px 20px;
                font-size: 1rem; /* تكبير الخط قليلاً ليكون أوضح */
            }

            .social-btn i {
                font-size: 1.3rem;
            }
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-wrapper">
        <div class="container">
            <div class="logo-container">
                <img src="your-logo.png" alt="Logo" class="logo-placeholder" onerror="this.style.display='none'">
                <span id="logo-text">YOUR LOGO</span>
            </div>
            
            <h1>MMK</h1>

            <div class="links">
                <a href="https://wa.me/yourlink" class="social-btn whatsapp">
                    <i class="fab fa-whatsapp"></i> واتساب الأعمال
                </a>
                <a href="https://www.tiktok.com/@mmk72409?_r=1&_t=ZS-96DmgVD5iGz" target="_blank" class="social-btn tiktok">
                    <i class="fab fa-tiktok"></i> تيك توك
                </a>
                <a href="#" class="social-btn instagram">
                    <i class="fab fa-instagram"></i> انستجرام
                </a>
                <a href="#" class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i> فيسبوك
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // --- إعدادات Three.js للمجسم 3D الضخم ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // إضاءة قوية للمجسم ليكون واضحاً جداً
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0x00ffcc, 3, 100);
        light1.position.set(10, 10, 15);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff0055, 2.5, 100);
        light2.position.set(-10, -10, 15);
        scene.add(light2);

        let textMesh;
        const loader = new THREE.FontLoader();
        // تحميل خط احترافي
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const geometry = new THREE.TextGeometry('MMK', {
                font: font,
                size: 11,         // تكبير حجم الكلمة
                height: 2.5,      // عمق المجسم
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.5,
                bevelSize: 0.3,
            });
            geometry.center();

            // إعدادات مادة المجسم ليكون مضيئاً وواضحاً من جميع الزوايا
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                metalness: 0.2,
                roughness: 0.1,
                transparent: true,
                opacity: 0.75,
                emissive: 0x004433,  // توهج داخلي لضمان الوضوح التام
                emissiveIntensity: 0.6,
                side: THREE.DoubleSide // لجعل الكلمة مرئية حتى من الخلف أثناء الدوران
            });

            textMesh = new THREE.Mesh(geometry, material);
            scene.add(textMesh);
        });

        // نجوم متحركة في الخلفية
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1200;
        const posArray = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) posArray[i] = (Math.random()-0.5)*150;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffffff });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // وظيفة لضبط الكاميرا بناءً على حجم الشاشة (لجعل المجسم كبيراً في الموبايل)
        function adjustCamera() {
            if (window.innerWidth < 768) {
                camera.position.z = 24; // تقريب المجسم جداً في الموبايل ليكون ضخماً
            } else {
                camera.position.z = 22; // الحجم المناسب للديسكتوب
            }
        }
        adjustCamera();

        let mX = 0, mY = 0;
        window.addEventListener('mousemove', (e) => {
            mX = (e.clientX - window.innerWidth/2) * 0.002;
            mY = (e.clientY - window.innerHeight/2) * 0.002;
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            if(textMesh) {
                // دوران مستمر في جميع النواحي لإظهار الكلمة من كل الزوايا
                textMesh.rotation.y = (time * 0.6) + mX; // دوران كامل مستمر (الدوار)
                textMesh.rotation.x = Math.sin(time * 0.5) * 0.3 + mY; // حركة ميلان خفيفة للأعلى والأسفل
                textMesh.rotation.z = Math.sin(time * 0.3) * 0.1; // ميلان جانبي بسيط
                textMesh.position.y = Math.cos(time * 0.8) * 1.5; // صعود وهبوط
            }
            
            starField.rotation.y += 0.001; // دوران النجوم
            renderer.render(scene, camera);
        }
        animate();

        // --- أنيميشن الواجهة GSAP ---
        window.onload = () => {
            gsap.to(".container", {
                opacity: 1,
                y: 0,
                duration: 1.5,
                ease: "expo.out"
            });

            gsap.to(".social-btn", {
                opacity: 1,
                scale: 1,
                stagger: 0.15,
                duration: 1,
                delay: 0.5,
                ease: "back.out(1.7)"
            });
        };

        // عند تغيير حجم الشاشة (Responsive Event)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            adjustCamera(); 
        });
    </script>
</body>
</html>
